<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天虹商场质量与检测热力图</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f5f7fb;
        color: #1f2a37;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        margin-top: 0;
        color: #5f6b7a;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin: 24px 0;
        padding: 16px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 200px;
      }

      label {
        font-size: 14px;
        color: #475569;
      }

      select,
      input[type="range"] {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d4dce6;
        background: #fff;
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 16px;
      }

      .cell {
        border-radius: 16px;
        padding: 16px;
        min-height: 140px;
        color: #0f172a;
        background: #f0f3f9;
        border: 1px solid rgba(15, 23, 42, 0.08);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
      }

      .cell:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 20px rgba(15, 23, 42, 0.12);
      }

      .cell h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .metrics {
        font-size: 14px;
        line-height: 1.6;
      }

      .legend {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #4b5563;
      }

      .legend-bar {
        flex: 1;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #d8f3dc 0%, #ffdda1 50%, #ff9aa2 100%);
      }

      .detail-card {
        margin-top: 24px;
        padding: 16px 20px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }

      .detail-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .detail-card p {
        margin: 4px 0;
        color: #475569;
      }

      @media (max-width: 960px) {
        body {
          padding: 20px;
        }

        .grid {
          grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <h1>天虹商场质量与检测热力图</h1>
    <p class="subtitle">按楼层与区域展示问题密度，重点区域采用加权放大。</p>

    <section class="controls">
      <div class="control-group">
        <label for="floorSelect">选择楼层</label>
        <select id="floorSelect"></select>
      </div>
      <div class="control-group">
        <label for="focusWeight">重点区域权重提升（当前：<span id="weightValue">1.5</span>）</label>
        <input id="focusWeight" type="range" min="1" max="2.5" step="0.1" value="1.5" />
      </div>
      <div class="control-group">
        <label>提示</label>
        <span>点击区域可查看详细问题与建议。</span>
      </div>
    </section>

    <section id="grid" class="grid"></section>

    <div class="legend">
      <span>低</span>
      <div class="legend-bar"></div>
      <span>高</span>
    </div>

    <section class="detail-card" id="detailCard">
      <h2>区域详情</h2>
      <p>请选择上方热力图中的任意区域查看细节。</p>
    </section>

    <script>
      const mallData = [
        {
          floor: "B1",
          areas: [
            { name: "设备间", issues: 6, weight: 1.8, notes: "机电巡检记录不完整" },
            { name: "员工通道", issues: 4, weight: 1.4, notes: "消防通道堆放杂物" },
            { name: "配电房", issues: 5, weight: 1.9, notes: "设备老化需巡检" },
            { name: "仓储区", issues: 2, weight: 1.1, notes: "货品摆放不规范" }
          ]
        },
        {
          floor: "L1",
          areas: [
            { name: "主入口", issues: 5, weight: 1.6, notes: "地面防滑标识缺失" },
            { name: "服务台", issues: 3, weight: 1.3, notes: "排队动线混乱" },
            { name: "中庭", issues: 7, weight: 1.8, notes: "顶棚照明检修提醒" },
            { name: "餐饮区", issues: 6, weight: 1.7, notes: "油烟净化巡检不足" }
          ]
        },
        {
          floor: "L2",
          areas: [
            { name: "女装区", issues: 4, weight: 1.2, notes: "货架安全提示不足" },
            { name: "男装区", issues: 3, weight: 1.1, notes: "消防标识遮挡" },
            { name: "母婴室", issues: 5, weight: 1.9, notes: "卫生检查频次偏低" },
            { name: "电梯厅", issues: 6, weight: 1.7, notes: "扶梯维护记录缺失" }
          ]
        },
        {
          floor: "L3",
          areas: [
            { name: "影院入口", issues: 4, weight: 1.4, notes: "客流高峰排队拥挤" },
            { name: "儿童乐园", issues: 8, weight: 2.1, notes: "安全护栏需重点检查" },
            { name: "健身房", issues: 3, weight: 1.2, notes: "设备保养记录缺失" },
            { name: "天台通道", issues: 2, weight: 1.1, notes: "地面照明偏暗" }
          ]
        }
      ];

      const floorSelect = document.getElementById("floorSelect");
      const grid = document.getElementById("grid");
      const focusWeight = document.getElementById("focusWeight");
      const weightValue = document.getElementById("weightValue");
      const detailCard = document.getElementById("detailCard");

      const getWeightedScore = (area, focusMultiplier) => {
        const focusBoost = area.weight >= 1.6 ? focusMultiplier : 1;
        return area.issues * area.weight * focusBoost;
      };

      const getHeatColor = (value, max) => {
        const ratio = max === 0 ? 0 : value / max;
        const start = [216, 243, 220];
        const mid = [255, 221, 161];
        const end = [255, 154, 162];
        const lerp = (a, b, t) => Math.round(a + (b - a) * t);

        let color;
        if (ratio <= 0.5) {
          const t = ratio / 0.5;
          color = start.map((c, i) => lerp(c, mid[i], t));
        } else {
          const t = (ratio - 0.5) / 0.5;
          color = mid.map((c, i) => lerp(c, end[i], t));
        }

        return `rgb(${color.join(",")})`;
      };

      const updateDetail = (area, score) => {
        detailCard.innerHTML = `
          <h2>${area.name}（${currentFloor().floor}）</h2>
          <p>问题数量：${area.issues}</p>
          <p>基础权重：${area.weight.toFixed(1)}</p>
          <p>加权热力值：${score.toFixed(1)}</p>
          <p>检查要点：${area.notes}</p>
        `;
      };

      const currentFloor = () => {
        const name = floorSelect.value || mallData[0].floor;
        return mallData.find((floor) => floor.floor === name) || mallData[0];
      };

      const renderGrid = () => {
        const focusMultiplier = Number(focusWeight.value);
        weightValue.textContent = focusMultiplier.toFixed(1);

        const { areas } = currentFloor();
        const scores = areas.map((area) => getWeightedScore(area, focusMultiplier));
        const maxScore = Math.max(...scores);

        grid.innerHTML = "";
        areas.forEach((area, index) => {
          const score = scores[index];
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.style.background = getHeatColor(score, maxScore);
          cell.innerHTML = `
            <h3>${area.name}</h3>
            <div class="metrics">
              <div>问题数量：${area.issues}</div>
              <div>基础权重：${area.weight.toFixed(1)}</div>
              <div>加权热力值：${score.toFixed(1)}</div>
            </div>
          `;
          cell.addEventListener("click", () => updateDetail(area, score));
          grid.appendChild(cell);
        });
      };

      const init = () => {
        mallData.forEach((floor) => {
          const option = document.createElement("option");
          option.value = floor.floor;
          option.textContent = floor.floor;
          floorSelect.appendChild(option);
        });
        floorSelect.value = mallData[1]?.floor || mallData[0].floor;
        renderGrid();
      };

      floorSelect.addEventListener("change", renderGrid);
      focusWeight.addEventListener("input", renderGrid);

      init();
    </script>
  </body>
</html>
