<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天虹商场质量与检测热力图</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: #f5f7fb;
        color: #1f2a37;
      }

      h1 {
        margin-bottom: 8px;
      }

      .subtitle {
        margin-top: 0;
        color: #5f6b7a;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin: 24px 0;
        padding: 16px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 200px;
      }

      label {
        font-size: 14px;
        color: #475569;
      }

      select,
      input[type="range"] {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d4dce6;
        background: #fff;
        font-size: 14px;
      }

      .building-wrap {
        display: flex;
        justify-content: center;
        margin: 24px 0 16px;
        perspective: 1200px;
      }

      .building {
        position: relative;
        width: 720px;
        height: 460px;
        transform-style: preserve-3d;
        transform: rotateX(60deg) rotateZ(-45deg);
        transition: transform 0.4s ease;
      }

      .building-face {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(148, 163, 184, 0.16), rgba(148, 163, 184, 0.04));
        border-radius: 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
      }

      .building-face.roof {
        transform: translateZ(260px);
      }

      .building-face.base {
        transform: translateZ(0);
      }

      .floor {
        position: absolute;
        left: 80px;
        width: 560px;
        height: 120px;
        border-radius: 18px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: rgba(255, 255, 255, 0.94);
        transform-style: preserve-3d;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 12px;
        box-shadow: 0 8px 18px rgba(15, 23, 42, 0.12);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .floor[data-active="true"] {
        box-shadow: 0 18px 28px rgba(15, 23, 42, 0.2);
        transform: translateZ(var(--floor-height)) scale(1.02);
      }

      .floor-title {
        position: absolute;
        top: -28px;
        left: 12px;
        font-weight: 600;
        color: #1f2937;
      }

      .cell {
        border-radius: 12px;
        padding: 10px;
        min-height: 72px;
        color: #0f172a;
        border: 1px solid rgba(15, 23, 42, 0.1);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .cell:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 14px rgba(15, 23, 42, 0.15);
      }

      .cell h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .metrics {
        font-size: 12px;
        line-height: 1.5;
      }

      .legend {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        color: #4b5563;
      }

      .legend-bar {
        flex: 1;
        height: 12px;
        border-radius: 999px;
        background: linear-gradient(90deg, #d8f3dc 0%, #ffdda1 50%, #ff9aa2 100%);
      }

      .detail-card {
        margin-top: 24px;
        padding: 16px 20px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }

      .detail-card h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .detail-card p {
        margin: 4px 0;
        color: #475569;
      }

      .data-panel {
        margin-top: 24px;
        padding: 16px 20px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }

      .data-panel h2 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      .data-panel p {
        margin: 4px 0 12px;
        color: #475569;
      }

      textarea#dataInput {
        width: 100%;
        min-height: 220px;
        border-radius: 12px;
        border: 1px solid #d4dce6;
        padding: 12px;
        font-family: "SFMono-Regular", "Menlo", "Monaco", monospace;
        font-size: 13px;
        background: #f8fafc;
        resize: vertical;
      }

      .data-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
      }

      .data-actions button {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      .data-actions button#resetData {
        background: #64748b;
      }

      .data-status {
        font-size: 13px;
        color: #16a34a;
      }

      @media (max-width: 960px) {
        body {
          padding: 20px;
        }

        .building {
          width: 100%;
          height: 360px;
          transform: rotateX(58deg) rotateZ(-40deg) scale(0.92);
        }

        .floor {
          left: 40px;
          width: calc(100% - 80px);
          height: 96px;
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <h1>天虹商场质量与检测热力图</h1>
    <p class="subtitle">三层建筑立体视图展示问题密度，重点区域采用加权放大（单文件离线可用）。</p>

    <section class="controls">
      <div class="control-group">
        <label for="focusWeight">重点区域权重提升（当前：<span id="weightValue">1.5</span>）</label>
        <input id="focusWeight" type="range" min="1" max="2.5" step="0.1" value="1.5" />
      </div>
      <div class="control-group">
        <label for="floorHighlight">高亮楼层</label>
        <select id="floorHighlight"></select>
      </div>
      <div class="control-group">
        <label>提示</label>
        <span>点击任意区域可查看详细问题与建议。</span>
      </div>
    </section>

    <section class="building-wrap">
      <div class="building" id="building">
        <div class="building-face roof"></div>
        <div class="building-face base"></div>
      </div>
    </section>

    <div class="legend">
      <span>低</span>
      <div class="legend-bar"></div>
      <span>高</span>
    </div>

    <section class="detail-card" id="detailCard">
      <h2>区域详情</h2>
      <p>请选择上方热力图中的任意区域查看细节。</p>
    </section>

    <section class="data-panel">
      <h2>数据编辑区</h2>
      <p>可直接编辑 JSON 数据并点击“应用数据”，无需依赖其他文件。</p>
      <textarea id="dataInput" spellcheck="false"></textarea>
      <div class="data-actions">
        <button id="applyData">应用数据</button>
        <button id="resetData" type="button">恢复示例数据</button>
        <span class="data-status" id="dataStatus"></span>
      </div>
    </section>

    <script>
      // 数据、样式、脚本均内联在本文件中，离线打开即可查看完整效果。
      const defaultMallData = [
        {
          floor: "L1",
          areas: [
            { name: "主入口", issues: 5, weight: 1.6, notes: "地面防滑标识缺失" },
            { name: "服务台", issues: 3, weight: 1.3, notes: "排队动线混乱" },
            { name: "中庭", issues: 7, weight: 1.8, notes: "顶棚照明检修提醒" },
            { name: "餐饮区", issues: 6, weight: 1.7, notes: "油烟净化巡检不足" }
          ]
        },
        {
          floor: "L2",
          areas: [
            { name: "女装区", issues: 4, weight: 1.2, notes: "货架安全提示不足" },
            { name: "男装区", issues: 3, weight: 1.1, notes: "消防标识遮挡" },
            { name: "母婴室", issues: 5, weight: 1.9, notes: "卫生检查频次偏低" },
            { name: "电梯厅", issues: 6, weight: 1.7, notes: "扶梯维护记录缺失" }
          ]
        },
        {
          floor: "L3",
          areas: [
            { name: "影院入口", issues: 4, weight: 1.4, notes: "客流高峰排队拥挤" },
            { name: "儿童乐园", issues: 8, weight: 2.1, notes: "安全护栏需重点检查" },
            { name: "健身房", issues: 3, weight: 1.2, notes: "设备保养记录缺失" },
            { name: "天台通道", issues: 2, weight: 1.1, notes: "地面照明偏暗" }
          ]
        }
      ];

      let mallData = JSON.parse(JSON.stringify(defaultMallData));

      const building = document.getElementById("building");
      const focusWeight = document.getElementById("focusWeight");
      const weightValue = document.getElementById("weightValue");
      const detailCard = document.getElementById("detailCard");
      const floorHighlight = document.getElementById("floorHighlight");
      const dataInput = document.getElementById("dataInput");
      const applyData = document.getElementById("applyData");
      const resetData = document.getElementById("resetData");
      const dataStatus = document.getElementById("dataStatus");

      const getWeightedScore = (area, focusMultiplier) => {
        const focusBoost = area.weight >= 1.6 ? focusMultiplier : 1;
        return area.issues * area.weight * focusBoost;
      };

      const getHeatColor = (value, max) => {
        const ratio = max === 0 ? 0 : value / max;
        const start = [216, 243, 220];
        const mid = [255, 221, 161];
        const end = [255, 154, 162];
        const lerp = (a, b, t) => Math.round(a + (b - a) * t);

        let color;
        if (ratio <= 0.5) {
          const t = ratio / 0.5;
          color = start.map((c, i) => lerp(c, mid[i], t));
        } else {
          const t = (ratio - 0.5) / 0.5;
          color = mid.map((c, i) => lerp(c, end[i], t));
        }

        return `rgb(${color.join(",")})`;
      };

      const updateDetail = (area, score, floorName) => {
        detailCard.innerHTML = `
          <h2>${area.name}（${floorName}）</h2>
          <p>问题数量：${area.issues}</p>
          <p>基础权重：${area.weight.toFixed(1)}</p>
          <p>加权热力值：${score.toFixed(1)}</p>
          <p>检查要点：${area.notes}</p>
        `;
      };

      const renderFloors = () => {
        const focusMultiplier = Number(focusWeight.value);
        weightValue.textContent = focusMultiplier.toFixed(1);
        building.querySelectorAll(".floor").forEach((floor) => floor.remove());

        const scoresByFloor = mallData.map((floor) =>
          floor.areas.map((area) => getWeightedScore(area, focusMultiplier))
        );
        const maxScore = Math.max(...scoresByFloor.flat());

        mallData.forEach((floor, index) => {
          const floorEl = document.createElement("div");
          floorEl.className = "floor";
          floorEl.style.setProperty("--floor-height", `${80 + index * 70}px`);
          floorEl.style.top = `${260 - index * 80}px`;
          floorEl.style.transform = `translateZ(${80 + index * 70}px)`;
          floorEl.dataset.floor = floor.floor;
          floorEl.dataset.active = floorHighlight.value === floor.floor;

          const title = document.createElement("div");
          title.className = "floor-title";
          title.textContent = floor.floor;
          floorEl.appendChild(title);

          floor.areas.forEach((area, areaIndex) => {
            const score = scoresByFloor[index][areaIndex];
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.style.background = getHeatColor(score, maxScore);
            cell.innerHTML = `
              <h3>${area.name}</h3>
              <div class="metrics">
                <div>问题数量：${area.issues}</div>
                <div>基础权重：${area.weight.toFixed(1)}</div>
                <div>加权热力值：${score.toFixed(1)}</div>
              </div>
            `;
            cell.addEventListener("click", () => updateDetail(area, score, floor.floor));
            floorEl.appendChild(cell);
          });

          building.appendChild(floorEl);
        });
      };

      const refreshFloorOptions = () => {
        floorHighlight.innerHTML = "";
        mallData.forEach((floor, index) => {
          const option = document.createElement("option");
          option.value = floor.floor;
          option.textContent = floor.floor;
          floorHighlight.appendChild(option);
          if (index === 0) {
            floorHighlight.value = floor.floor;
          }
        });
      };

      const updateDataInput = () => {
        dataInput.value = JSON.stringify(mallData, null, 2);
      };

      const setStatus = (message, isError = false) => {
        dataStatus.textContent = message;
        dataStatus.style.color = isError ? "#dc2626" : "#16a34a";
      };

      const applyDataUpdate = () => {
        try {
          const parsed = JSON.parse(dataInput.value);
          if (!Array.isArray(parsed) || parsed.length === 0) {
            throw new Error("数据必须是楼层数组");
          }
          mallData = parsed;
          refreshFloorOptions();
          renderFloors();
          setStatus("数据已更新，可继续调整。", false);
        } catch (error) {
          setStatus(`数据格式错误：${error.message}`, true);
        }
      };

      const resetDataToDefault = () => {
        mallData = JSON.parse(JSON.stringify(defaultMallData));
        updateDataInput();
        refreshFloorOptions();
        renderFloors();
        setStatus("已恢复示例数据。", false);
      };

      const init = () => {
        updateDataInput();
        refreshFloorOptions();
        renderFloors();
      };

      focusWeight.addEventListener("input", renderFloors);
      floorHighlight.addEventListener("change", renderFloors);
      applyData.addEventListener("click", applyDataUpdate);
      resetData.addEventListener("click", resetDataToDefault);

      init();
    </script>
  </body>
</html>
